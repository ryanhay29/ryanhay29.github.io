<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ryan Hay</title>
  <link rel="icon" type="image/png" href="../images/icon.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .monkey-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .monkey-wrap video {
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
    }
    .unmute-hint {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      background: rgba(0, 0, 0, 0.55);
      padding: 0.6rem 1.1rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      animation: fadeInHint 0.6s ease 0.4s forwards, pulseHint 2s ease-in-out 1s infinite;
      pointer-events: none;
      z-index: 10;
    }
    .unmute-hint svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    @keyframes fadeInHint {
      to { opacity: 1; }
    }
    @keyframes pulseHint {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .unmute-hint.hidden {
      animation: none;
      opacity: 0 !important;
      transition: opacity 0.3s ease;
    }
    .hint-mobile { display: none; }
    .hint-desktop { display: inline; }

    .video-credit {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      color: rgba(255, 255, 255, 0.65);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      z-index: 10;
      opacity: 0;
      animation: fadeInHint 0.6s ease 0.6s forwards;
      transition: color 0.2s ease, background 0.2s ease;
    }
    .video-credit:hover {
      color: white;
      background: rgba(0, 0, 0, 0.6);
    }

    /* Mobile: move the sound hint higher, and swap text to "Tap" */
    @media (max-width: 600px) {
      .unmute-hint {
        bottom: 4.5rem;
      }
      .hint-mobile { display: inline; }
      .hint-desktop { display: none; }
    }
  </style>
</head>
<body>
  <div class="monkey-wrap" id="monkeyWrap">
    <video id="monkeyVideo" src="secret.mp4" autoplay loop playsinline muted></video>
    <div class="unmute-hint" id="unmuteHint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
      <span class="hint-mobile">Tap anywhere for sound</span>
      <span class="hint-desktop">Click anywhere for sound</span>
    </div>
    <a href="https://www.instagram.com/saraandspot" target="_blank" rel="noopener" class="video-credit" onclick="event.stopPropagation()">
      @saraandspot
    </a>
  </div>

  <script>
    const wrap = document.getElementById('monkeyWrap');
    const video = document.getElementById('monkeyVideo');
    const hint = document.getElementById('unmuteHint');

    video.muted = true;
    video.play().catch(err => console.log('Autoplay blocked:', err));

    function tryFullscreen() {
      if (wrap.requestFullscreen) {
        wrap.requestFullscreen().catch(() => {});
      }
    }
    tryFullscreen();

    document.addEventListener('click', () => {
      if (!document.fullscreenElement) tryFullscreen();
      video.muted = false;
      video.play();
      hint.classList.add('hidden');
    }, { once: true });
  </script>
</body>
</html>
